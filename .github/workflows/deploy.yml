name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Integration & security tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: u
          POSTGRES_PASSWORD: p
          POSTGRES_DB: d
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U u -d d"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: be-rongsok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: be-rongsok/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Run tests (migrasi + API + 40 skenario)
        run: npm test
        env:
          DATABASE_URL: postgresql://u:p@127.0.0.1:5432/d?schema=public

  build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mrfroglab/be-rongsok.in
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: be-rongsok/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Thinkpad Server
    needs: build
    runs-on: self-hosted
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with Docker Compose
        run: |
          echo "Pulling latest image..."
          docker compose -f /opt/stacks/apps/rongsokin/docker-compose.yml pull app

          echo "Recreating container..."
          docker compose -f /opt/stacks/apps/rongsokin/docker-compose.yml up -d --remove-orphans app

          echo "Cleaning unused images..."
          docker image prune -f

      - name: Verify Deployment
        run: |
          sleep 5
          docker ps --filter "name=rongsokin-api" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
