name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint, unit & integration tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: u
          POSTGRES_PASSWORD: p
          POSTGRES_DB: d
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U u -d d"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Tests (unit + integrasi HTTP/WebSocket/PostGIS)
        run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://u:p@127.0.0.1:5432/d

  build:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mrfroglab/be-rongsok.in
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Thinkpad Server
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with Docker Compose
        run: |
          echo "Pulling latest image..."
          docker compose -f /opt/stacks/apps/rongsokin/docker-compose.yml pull app

          echo "Recreating container..."
          docker compose -f /opt/stacks/apps/rongsokin/docker-compose.yml up -d --remove-orphans app

          echo "Cleaning unused images..."
          docker image prune -f

      - name: Verify Deployment
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' rongsokin-api 2>/dev/null || true)
            [ "$s" = healthy ] && break; sleep 3
          done
          docker ps --filter "name=rongsokin-api" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          [ "$(docker inspect -f '{{.State.Health.Status}}' rongsokin-api)" = healthy ]
